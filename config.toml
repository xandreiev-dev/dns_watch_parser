[parser]
source = "dns"
shop_id = 6
max_pages_per_brand = 1
request_timeout = 60
delay_min = 2
delay_max = 6
max_retries = 5
resume_enabled = true
headless = true
use_playwright_fallback = false
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"
user_agents = [
  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36",
  "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Safari/605.1.15",
  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"
]

[browser]
# DNS often returns anti-bot 401/403 for plain HTTP clients. Use "cdp" after
# launching Chrome with --remote-debugging-port=9223 and logging in once by hand.
mode = "http" # http, playwright, cdp
cdp_url = "http://127.0.0.1:9223"
storage_state_path = "tmp/state/dns_browser_state.json"
page_wait_until = "domcontentloaded"
page_wait_selector = ""
extra_wait_ms = 1500
auto_scroll = true
scroll_steps = 90
proxy_server = ""
reuse_page = true
browser_retries = 1
browser_connect_timeout = 30

[output]
dir = "brand_exports"
filename_prefix = "DNS_watch_ru"
include_timestamp = false

[tmp]
dir = "tmp"
resume_state_path = "tmp/state/dns_parser_state.json"

[telegram]
enabled = false

[brands]
items = [
  "Apple",
  "Samsung",
  "Garmin",
  "Huawei",
  "Honor",
  "Amazfit",
  "Xiaomi",
  "Redmi",
  "Google",
  "OnePlus",
  "Oppo",
  "Motorola",
  "Tecno"
]

[start_urls]
urls = [
  "https://www.dns-shop.ru/search/?q=%D1%81%D0%BC%D0%B0%D1%80%D1%82-%D1%87%D0%B0%D1%81%D1%8B&category=251c82c88ed24e77"
]
