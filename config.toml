[parser]
source = "dns"
shop_id = 0
max_pages_per_brand = 0
request_timeout = 30
delay_min = 2
delay_max = 6
max_retries = 5
resume_enabled = true
headless = true
use_playwright_fallback = false
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"
user_agents = [
  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36",
  "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Safari/605.1.15",
  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"
]

[browser]
# DNS often returns anti-bot 401/403 for plain HTTP clients. Use "cdp" after
# launching Chrome with --remote-debugging-port=9222 and logging in once by hand.
mode = "http" # http, playwright, cdp
cdp_url = "http://127.0.0.1:9222"
storage_state_path = "tmp/state/dns_browser_state.json"
page_wait_until = "domcontentloaded"
page_wait_selector = ""
extra_wait_ms = 1500
auto_scroll = true
scroll_steps = 4
proxy_server = ""
reuse_page = false
browser_retries = 1
browser_connect_timeout = 10

[output]
dir = "brand_exports"
filename_prefix = "dns_watch"
include_timestamp = true

[tmp]
dir = "tmp"
resume_state_path = "tmp/state/dns_parser_state.json"

[telegram]
enabled = false

[brands]
items = [
  "Apple",
  "Samsung",
  "Garmin",
  "Huawei",
  "Honor",
  "Amazfit",
  "Xiaomi",
  "Redmi",
  "Google",
  "OnePlus",
  "Oppo",
  "Motorola"
]

[start_urls]
urls = [
  "https://www.dns-shop.ru/catalog/recipe/782ee054089287e3/smart-casy/",
  "https://www.dns-shop.ru/catalog/fa58a48980ca51bf/detskie-casy/"
]
