[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-watch-parser"
version = "0.1.0"
description = "DNS smart watch parser with XLSX export and resume support"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "openpyxl>=3.1.2",
  "pandas>=2.2.2",
  "playwright>=1.44.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
]

[project.optional-dependencies]
test = ["pytest>=8.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
